<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#f5f5f5"/>

  <!-- Top Menu Bar -->
  <rect x="0" y="0" width="1200" height="50" fill="#2c3e50"/>
  <text x="20" y="30" font-family="Inter, Arial" font-size="16" fill="white" font-weight="600">Onshape</text>
  <text x="120" y="30" font-family="Inter, Arial" font-size="14" fill="#bdc3c7">CTRC-BattleBot-YourName</text>

  <!-- Left Toolbar -->
  <rect x="0" y="50" width="60" height="750" fill="#34495e"/>

  <!-- Undo/Redo Icons -->
  <circle cx="30" cy="80" r="8" fill="none" stroke="#95a5a6" stroke-width="2"/>
  <path d="M 25 80 Q 25 75 30 75 L 35 75" fill="none" stroke="#95a5a6" stroke-width="2"/>
  <circle cx="30" cy="110" r="8" fill="none" stroke="#95a5a6" stroke-width="2"/>
  <path d="M 35 110 Q 35 105 30 105 L 25 105" fill="none" stroke="#95a5a6" stroke-width="2"/>

  <!-- Sketch Tool Icon (highlighted) -->
  <rect x="15" y="140" width="30" height="30" rx="4" fill="#3498db"/>
  <rect x="20" y="150" width="20" height="15" fill="none" stroke="white" stroke-width="2"/>
  <line x1="25" y1="155" x2="35" y2="155" stroke="white" stroke-width="2"/>
  <text x="75" y="165" font-family="Inter, Arial" font-size="12" fill="#2c3e50" font-weight="600">← Sketch Tool</text>
  <text x="75" y="180" font-family="Inter, Arial" font-size="10" fill="#7f8c8d">(Click to start sketching)</text>

  <!-- Feature Tree Panel -->
  <rect x="60" y="50" width="280" height="750" fill="white" stroke="#bdc3c7" stroke-width="1"/>
  <text x="80" y="80" font-family="Inter, Arial" font-size="14" fill="#2c3e50" font-weight="700">Feature Tree</text>

  <!-- Part Studio entry -->
  <g>
    <rect x="80" y="100" width="240" height="30" fill="#ecf0f1" rx="3"/>
    <text x="90" y="120" font-family="Inter, Arial" font-size="13" fill="#2c3e50" font-weight="600">Part Studio 1</text>
  </g>

  <!-- Origin -->
  <g>
    <circle cx="90" cy="150" r="4" fill="#95a5a6"/>
    <text x="105" y="155" font-family="Inter, Arial" font-size="12" fill="#2c3e50">Origin</text>
  </g>

  <!-- Planes -->
  <g>
    <rect x="100" y="170" width="200" height="25" fill="#e8f4f8" rx="2"/>
    <rect x="105" y="175" width="15" height="15" fill="none" stroke="#3498db" stroke-width="2"/>
    <text x="125" y="188" font-family="Inter, Arial" font-size="12" fill="#2c3e50" font-weight="500">Top Plane</text>
    <text x="220" y="188" font-family="Inter, Arial" font-size="10" fill="#3498db">← Select this</text>
  </g>

  <g>
    <rect x="105" y="205" width="15" height="15" fill="none" stroke="#95a5a6" stroke-width="2"/>
    <text x="125" y="218" font-family="Inter, Arial" font-size="12" fill="#7f8c8d">Front Plane</text>
  </g>

  <g>
    <rect x="105" y="235" width="15" height="15" fill="none" stroke="#95a5a6" stroke-width="2"/>
    <text x="125" y="248" font-family="Inter, Arial" font-size="12" fill="#7f8c8d">Right Plane</text>
  </g>

  <!-- Main Graphics Area -->
  <rect x="340" y="50" width="860" height="750" fill="#f8f9fa"/>

  <!-- Coordinate System in 3D View -->
  <g transform="translate(600, 400)">
    <!-- X axis (red) -->
    <line x1="0" y1="0" x2="80" y2="-20" stroke="#e74c3c" stroke-width="3"/>
    <text x="85" y="-15" font-family="Inter, Arial" font-size="14" fill="#e74c3c" font-weight="700">X</text>

    <!-- Y axis (green) -->
    <line x1="0" y1="0" x2="-60" y2="-30" stroke="#2ecc71" stroke-width="3"/>
    <text x="-75" y="-25" font-family="Inter, Arial" font-size="14" fill="#2ecc71" font-weight="700">Y</text>

    <!-- Z axis (blue) -->
    <line x1="0" y1="0" x2="0" y2="-100" stroke="#3498db" stroke-width="3"/>
    <text x="5" y="-105" font-family="Inter, Arial" font-size="14" fill="#3498db" font-weight="700">Z</text>

    <!-- Origin point -->
    <circle cx="0" cy="0" r="5" fill="#2c3e50"/>
  </g>

  <!-- Top Plane representation (horizontal grid) -->
  <g opacity="0.3">
    <line x1="500" y1="400" x2="900" y2="350" stroke="#bdc3c7" stroke-width="1"/>
    <line x1="500" y1="420" x2="900" y2="370" stroke="#bdc3c7" stroke-width="1"/>
    <line x1="500" y1="440" x2="900" y2="390" stroke="#bdc3c7" stroke-width="1"/>
    <line x1="500" y1="460" x2="900" y2="410" stroke="#bdc3c7" stroke-width="1"/>

    <line x1="540" y1="500" x2="620" y2="300" stroke="#bdc3c7" stroke-width="1"/>
    <line x1="600" y1="510" x2="680" y2="310" stroke="#bdc3c7" stroke-width="1"/>
    <line x1="660" y1="520" x2="740" y2="320" stroke="#bdc3c7" stroke-width="1"/>
    <line x1="720" y1="530" x2="800" y2="330" stroke="#bdc3c7" stroke-width="1"/>
  </g>

  <!-- Instruction Dialog Box -->
  <rect x="420" y="120" width="400" height="140" fill="white" stroke="#3498db" stroke-width="2" rx="8"/>
  <rect x="420" y="120" width="400" height="40" fill="#3498db" rx="8"/>
  <text x="440" y="145" font-family="Inter, Arial" font-size="16" fill="white" font-weight="700">Select a Sketch Plane</text>

  <text x="440" y="190" font-family="Inter, Arial" font-size="13" fill="#2c3e50">Click on one of the planes to begin sketching:</text>
  <text x="460" y="210" font-family="Inter, Arial" font-size="12" fill="#7f8c8d">• Top Plane (XY plane)</text>
  <text x="460" y="228" font-family="Inter, Arial" font-size="12" fill="#7f8c8d">• Front Plane (XZ plane)</text>
  <text x="460" y="246" font-family="Inter, Arial" font-size="12" fill="#7f8c8d">• Right Plane (YZ plane)</text>

  <!-- Annotations -->
  <g>
    <!-- Arrow pointing to sketch tool -->
    <path d="M 70 200 Q 50 180 30 170" fill="none" stroke="#e67e22" stroke-width="2" marker-end="url(#arrowhead)"/>
    <circle cx="70" cy="200" r="3" fill="#e67e22"/>

    <!-- Arrow pointing to Top Plane -->
    <path d="M 335 185 L 320 185" stroke="#e67e22" stroke-width="2" marker-end="url(#arrowhead)"/>
    <circle cx="335" cy="185" r="3" fill="#e67e22"/>
  </g>

  <!-- Step indicator -->
  <rect x="950" y="680" width="200" height="80" fill="#e8f4f8" rx="6"/>
  <text x="970" y="705" font-family="Inter, Arial" font-size="12" fill="#7f8c8d" font-weight="600">STEP 1 OF 5</text>
  <text x="970" y="725" font-family="Inter, Arial" font-size="14" fill="#2c3e50" font-weight="700">Part Studio Setup</text>
  <text x="970" y="745" font-family="Inter, Arial" font-size="11" fill="#7f8c8d">Click Sketch, then select</text>
  <text x="970" y="758" font-family="Inter, Arial" font-size="11" fill="#7f8c8d">Top Plane to begin</text>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#e67e22"/>
    </marker>
  </defs>

  <!-- Units indicator -->
  <text x="950" y="80" font-family="Inter, Arial" font-size="11" fill="#2c3e50">Units: Millimeters</text>
  <text x="950" y="95" font-family="Inter, Arial" font-size="9" fill="#7f8c8d">(Check in document settings)</text>
</svg>