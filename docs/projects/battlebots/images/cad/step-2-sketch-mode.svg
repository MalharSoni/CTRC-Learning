<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#f5f5f5"/>

  <!-- Top Menu Bar -->
  <rect x="0" y="0" width="1200" height="50" fill="#2c3e50"/>
  <text x="20" y="30" font-family="Inter, Arial" font-size="16" fill="white" font-weight="600">Onshape</text>
  <text x="120" y="30" font-family="Inter, Arial" font-size="14" fill="#bdc3c7">CTRC-BattleBot-YourName</text>
  <rect x="1050" y="15" width="120" height="25" rx="4" fill="#27ae60"/>
  <text x="1075" y="32" font-family="Inter, Arial" font-size="12" fill="white" font-weight="600">✓ Checkmark</text>

  <!-- Left Toolbar (Sketch Mode) -->
  <rect x="0" y="50" width="60" height="750" fill="#34495e"/>

  <!-- Sketch Tools -->
  <g>
    <!-- Line tool -->
    <rect x="15" y="80" width="30" height="30" rx="4" fill="#7f8c8d"/>
    <line x1="20" y1="105" x2="40" y2="85" stroke="white" stroke-width="2"/>

    <!-- Rectangle tool (highlighted) -->
    <rect x="15" y="120" width="30" height="30" rx="4" fill="#3498db"/>
    <rect x="20" y="130" width="20" height="15" fill="none" stroke="white" stroke-width="2"/>
    <text x="75" y="140" font-family="Inter, Arial" font-size="12" fill="#2c3e50" font-weight="600">← Rectangle Tool</text>

    <!-- Circle tool -->
    <rect x="15" y="160" width="30" height="30" rx="4" fill="#7f8c8d"/>
    <circle cx="30" cy="175" r="8" fill="none" stroke="white" stroke-width="2"/>

    <!-- Dimension tool -->
    <rect x="15" y="220" width="30" height="30" rx="4" fill="#7f8c8d"/>
    <line x1="20" y1="230" x2="40" y2="230" stroke="white" stroke-width="2"/>
    <line x1="20" y1="240" x2="40" y2="240" stroke="white" stroke-width="2"/>
    <text x="23" y="237" font-family="Arial" font-size="8" fill="white" font-weight="700">D</text>
  </g>

  <!-- Feature Tree Panel -->
  <rect x="60" y="50" width="280" height="750" fill="white" stroke="#bdc3c7" stroke-width="1"/>
  <text x="80" y="80" font-family="Inter, Arial" font-size="14" fill="#2c3e50" font-weight="700">Feature Tree</text>

  <!-- Part Studio entry -->
  <g>
    <rect x="80" y="100" width="240" height="30" fill="#ecf0f1" rx="3"/>
    <text x="90" y="120" font-family="Inter, Arial" font-size="13" fill="#2c3e50" font-weight="600">Part Studio 1</text>
  </g>

  <!-- Sketch entry (highlighted) -->
  <g>
    <rect x="90" y="140" width="220" height="30" fill="#e8f4f8" rx="3"/>
    <rect x="95" y="148" width="14" height="14" fill="none" stroke="#3498db" stroke-width="2"/>
    <text x="115" y="160" font-family="Inter, Arial" font-size="12" fill="#2c3e50" font-weight="600">Sketch 1</text>
    <text x="250" y="160" font-family="Inter, Arial" font-size="10" fill="#3498db">ACTIVE</text>
  </g>

  <!-- Main Graphics Area - 2D Sketch View -->
  <rect x="340" y="50" width="860" height="750" fill="white"/>

  <!-- Grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ecf0f1" stroke-width="1"/>
    </pattern>
  </defs>
  <rect x="340" y="50" width="860" height="750" fill="url(#grid)"/>

  <!-- Coordinate system (2D view from above) -->
  <g transform="translate(600, 400)">
    <!-- X axis (horizontal, red) -->
    <line x1="-300" y1="0" x2="300" y2="0" stroke="#e74c3c" stroke-width="2"/>
    <text x="310" y="5" font-family="Inter, Arial" font-size="14" fill="#e74c3c" font-weight="700">X</text>

    <!-- Y axis (vertical, green) -->
    <line x1="0" y1="-250" x2="0" y2="250" stroke="#2ecc71" stroke-width="2"/>
    <text x="5" y="-260" font-family="Inter, Arial" font-size="14" fill="#2ecc71" font-weight="700">Y</text>

    <!-- Origin point -->
    <circle cx="0" cy="0" r="5" fill="#2c3e50"/>
  </g>

  <!-- Chassis base rectangle (100mm x 80mm) -->
  <g transform="translate(600, 400)">
    <!-- Rectangle outline (blue - fully defined) -->
    <rect x="-100" y="-80" width="200" height="160" fill="none" stroke="#3498db" stroke-width="3"/>

    <!-- Corner points -->
    <circle cx="-100" cy="-80" r="4" fill="#3498db"/>
    <circle cx="100" cy="-80" r="4" fill="#3498db"/>
    <circle cx="100" cy="80" r="4" fill="#3498db"/>
    <circle cx="-100" cy="80" r="4" fill="#3498db"/>

    <!-- Horizontal dimension (100mm) -->
    <line x1="-100" y1="-110" x2="100" y2="-110" stroke="#2c3e50" stroke-width="1"/>
    <line x1="-100" y1="-105" x2="-100" y2="-115" stroke="#2c3e50" stroke-width="1"/>
    <line x1="100" y1="-105" x2="100" y2="-115" stroke="#2c3e50" stroke-width="1"/>
    <rect x="-25" y="-125" width="50" height="20" fill="white" stroke="#2c3e50" stroke-width="1" rx="2"/>
    <text x="-18" y="-110" font-family="Inter, Arial" font-size="12" fill="#2c3e50" font-weight="600">100</text>

    <!-- Vertical dimension (80mm) -->
    <line x1="130" y1="-80" x2="130" y2="80" stroke="#2c3e50" stroke-width="1"/>
    <line x1="125" y1="-80" x2="135" y2="-80" stroke="#2c3e50" stroke-width="1"/>
    <line x1="125" y1="80" x2="135" y2="80" stroke="#2c3e50" stroke-width="1"/>
    <rect x="140" y="-10" width="40" height="20" fill="white" stroke="#2c3e50" stroke-width="1" rx="2"/>
    <text x="148" y="5" font-family="Inter, Arial" font-size="12" fill="#2c3e50" font-weight="600">80</text>

    <!-- Center constraint icon -->
    <circle cx="0" cy="0" r="8" fill="none" stroke="#e67e22" stroke-width="2"/>
    <line x1="-6" y1="0" x2="6" y2="0" stroke="#e67e22" stroke-width="2"/>
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#e67e22" stroke-width="2"/>
  </g>

  <!-- Dimension Dialog Box -->
  <rect x="420" y="200" width="180" height="100" fill="white" stroke="#3498db" stroke-width="2" rx="6"/>
  <rect x="420" y="200" width="180" height="30" fill="#3498db" rx="6"/>
  <text x="440" y="220" font-family="Inter, Arial" font-size="13" fill="white" font-weight="700">Dimension</text>

  <text x="440" y="255" font-family="Inter, Arial" font-size="11" fill="#2c3e50">Length:</text>
  <rect x="490" y="242" width="90" height="22" fill="#ecf0f1" stroke="#95a5a6" stroke-width="1" rx="2"/>
  <text x="505" y="258" font-family="Inter, Arial" font-size="12" fill="#2c3e50" font-weight="600">100 mm</text>

  <rect x="500" y="273" width="60" height="20" rx="3" fill="#27ae60"/>
  <text x="518" y="287" font-family="Inter, Arial" font-size="11" fill="white" font-weight="600">OK</text>

  <!-- Sketch Constraints Panel -->
  <rect x="920" y="500" width="240" height="200" fill="white" stroke="#bdc3c7" stroke-width="1" rx="4"/>
  <text x="935" y="525" font-family="Inter, Arial" font-size="12" fill="#2c3e50" font-weight="700">Active Constraints</text>

  <g transform="translate(935, 545)">
    <circle cx="0" cy="0" r="3" fill="#27ae60"/>
    <text x="10" y="4" font-family="Inter, Arial" font-size="11" fill="#2c3e50">Horizontal (2)</text>

    <circle cx="0" cy="20" r="3" fill="#27ae60"/>
    <text x="10" y="24" font-family="Inter, Arial" font-size="11" fill="#2c3e50">Vertical (2)</text>

    <circle cx="0" cy="40" r="3" fill="#27ae60"/>
    <text x="10" y="44" font-family="Inter, Arial" font-size="11" fill="#2c3e50">Equal (4 sides)</text>

    <circle cx="0" cy="60" r="3" fill="#27ae60"/>
    <text x="10" y="64" font-family="Inter, Arial" font-size="11" fill="#2c3e50">Midpoint (center)</text>

    <circle cx="0" cy="80" r="3" fill="#27ae60"/>
    <text x="10" y="84" font-family="Inter, Arial" font-size="11" fill="#2c3e50">Length: 100mm</text>

    <circle cx="0" cy="100" r="3" fill="#27ae60"/>
    <text x="10" y="104" font-family="Inter, Arial" font-size="11" fill="#2c3e50">Length: 80mm</text>
  </g>

  <rect x="935" y="660" width="200" height="25" fill="#e8f8f5" rx="3"/>
  <text x="945" y="677" font-family="Inter, Arial" font-size="11" fill="#27ae60" font-weight="600">✓ Fully Defined (Black)</text>

  <!-- Annotations -->
  <g>
    <!-- Arrow pointing to rectangle -->
    <path d="M 580 320 L 560 340" stroke="#e67e22" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="585" y="325" font-family="Inter, Arial" font-size="11" fill="#e67e22" font-weight="600">Chassis base</text>
    <text x="585" y="340" font-family="Inter, Arial" font-size="10" fill="#7f8c8d">100mm × 80mm</text>

    <!-- Arrow pointing to dimensions -->
    <circle cx="480" cy="150" r="3" fill="#e67e22"/>
    <path d="M 480 150 L 500 280" stroke="#e67e22" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="420" y="145" font-family="Inter, Arial" font-size="11" fill="#e67e22" font-weight="600">Add dimensions</text>
    <text x="420" y="160" font-family="Inter, Arial" font-size="10" fill="#7f8c8d">to fully define sketch</text>
  </g>

  <!-- Step indicator -->
  <rect x="950" y="80" width="200" height="100" fill="#e8f4f8" rx="6"/>
  <text x="970" y="105" font-family="Inter, Arial" font-size="12" fill="#7f8c8d" font-weight="600">STEP 2 OF 5</text>
  <text x="970" y="125" font-family="Inter, Arial" font-size="14" fill="#2c3e50" font-weight="700">Sketch Mode</text>
  <text x="970" y="145" font-family="Inter, Arial" font-size="11" fill="#7f8c8d">1. Draw rectangle</text>
  <text x="970" y="160" font-family="Inter, Arial" font-size="11" fill="#7f8c8d">2. Add dimensions</text>
  <text x="970" y="175" font-family="Inter, Arial" font-size="11" fill="#7f8c8d">3. Sketch turns black when</text>
  <text x="975" y="188" font-family="Inter, Arial" font-size="11" fill="#7f8c8d">fully defined</text>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#e67e22"/>
    </marker>
  </defs>

  <!-- View indicator -->
  <rect x="340" y="60" width="120" height="30" fill="#ecf0f1" rx="4"/>
  <text x="360" y="80" font-family="Inter, Arial" font-size="12" fill="#2c3e50" font-weight="600">View: Top</text>
</svg>