<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#f5f5f5"/>

  <!-- Top Menu Bar -->
  <rect x="0" y="0" width="1200" height="50" fill="#2c3e50"/>
  <text x="20" y="30" font-family="Inter, Arial" font-size="16" fill="white" font-weight="600">Onshape</text>
  <text x="120" y="30" font-family="Inter, Arial" font-size="14" fill="#bdc3c7">CTRC-BattleBot-YourName</text>

  <!-- Left Toolbar (Part Studio Mode) -->
  <rect x="0" y="50" width="60" height="750" fill="#34495e"/>

  <!-- Part Studio Tools -->
  <g>
    <!-- Extrude tool (highlighted) -->
    <rect x="15" y="80" width="30" height="30" rx="4" fill="#3498db"/>
    <rect x="22" y="88" width="16" height="12" fill="none" stroke="white" stroke-width="2"/>
    <polygon points="30,88 30,100 38,94" fill="white"/>
    <text x="75" y="100" font-family="Inter, Arial" font-size="12" fill="#2c3e50" font-weight="600">← Extrude Tool</text>

    <!-- Revolve tool -->
    <rect x="15" y="120" width="30" height="30" rx="4" fill="#7f8c8d"/>
    <circle cx="30" cy="135" r="8" fill="none" stroke="white" stroke-width="2"/>
    <circle cx="30" cy="135" r="4" fill="white"/>

    <!-- Sweep tool -->
    <rect x="15" y="160" width="30" height="30" rx="4" fill="#7f8c8d"/>
    <path d="M 22 175 Q 30 165 38 175" fill="none" stroke="white" stroke-width="2"/>
  </g>

  <!-- Feature Tree Panel -->
  <rect x="60" y="50" width="280" height="750" fill="white" stroke="#bdc3c7" stroke-width="1"/>
  <text x="80" y="80" font-family="Inter, Arial" font-size="14" fill="#2c3e50" font-weight="700">Feature Tree</text>

  <!-- Part Studio entry -->
  <g>
    <rect x="80" y="100" width="240" height="30" fill="#ecf0f1" rx="3"/>
    <text x="90" y="120" font-family="Inter, Arial" font-size="13" fill="#2c3e50" font-weight="600">Part Studio 1</text>
  </g>

  <!-- Sketch entry -->
  <g>
    <rect x="90" y="140" width="220" height="25" fill="white" rx="3"/>
    <rect x="95" y="145" width="12" height="12" fill="none" stroke="#95a5a6" stroke-width="2"/>
    <text x="115" y="157" font-family="Inter, Arial" font-size="12" fill="#2c3e50">Sketch 1</text>
  </g>

  <!-- Extrude entry (active) -->
  <g>
    <rect x="90" y="170" width="220" height="25" fill="#e8f4f8" rx="3"/>
    <rect x="95" y="175" width="12" height="12" fill="none" stroke="#3498db" stroke-width="2"/>
    <polygon points="101,175 101,187 107,181" fill="#3498db"/>
    <text x="115" y="187" font-family="Inter, Arial" font-size="12" fill="#2c3e50" font-weight="600">Extrude 1</text>
    <text x="245" y="187" font-family="Inter, Arial" font-size="10" fill="#3498db">ACTIVE</text>
  </g>

  <!-- Main Graphics Area - Isometric 3D View -->
  <rect x="340" y="50" width="860" height="750" fill="#f8f9fa"/>

  <!-- 3D Coordinate system -->
  <g transform="translate(900, 450)">
    <!-- X axis (red) -->
    <line x1="0" y1="0" x2="80" y2="-20" stroke="#e74c3c" stroke-width="3"/>
    <text x="85" y="-15" font-family="Inter, Arial" font-size="14" fill="#e74c3c" font-weight="700">X</text>

    <!-- Y axis (green) -->
    <line x1="0" y1="0" x2="-60" y2="-30" stroke="#2ecc71" stroke-width="3"/>
    <text x="-75" y="-25" font-family="Inter, Arial" font-size="14" fill="#2ecc71" font-weight="700">Y</text>

    <!-- Z axis (blue) -->
    <line x1="0" y1="0" x2="0" y2="-100" stroke="#3498db" stroke-width="3"/>
    <text x="5" y="-105" font-family="Inter, Arial" font-size="14" fill="#3498db" font-weight="700">Z</text>

    <!-- Origin point -->
    <circle cx="0" cy="0" r="5" fill="#2c3e50"/>
  </g>

  <!-- 3D Chassis Preview (isometric) -->
  <g transform="translate(650, 400)">
    <!-- Bottom face -->
    <polygon points="-100,-50 100,-70 100,90 -100,110" fill="#3498db" opacity="0.3" stroke="#2c3e50" stroke-width="2"/>

    <!-- Front face -->
    <polygon points="-100,-50 100,-70 100,-100 -100,-80" fill="#3498db" opacity="0.8" stroke="#2c3e50" stroke-width="2"/>

    <!-- Right face -->
    <polygon points="100,-70 100,-100 100,60 100,90" fill="#3498db" opacity="0.5" stroke="#2c3e50" stroke-width="2"/>

    <!-- Back face -->
    <polygon points="-100,110 100,90 100,60 -100,80" fill="#3498db" opacity="0.7" stroke="#2c3e50" stroke-width="2"/>

    <!-- Left face -->
    <polygon points="-100,-50 -100,-80 -100,80 -100,110" fill="#3498db" opacity="0.6" stroke="#2c3e50" stroke-width="2"/>

    <!-- Top face (highlighted as selected region) -->
    <polygon points="-100,-80 100,-100 100,60 -100,80" fill="#3498db" opacity="0.9" stroke="#2c3e50" stroke-width="3"/>

    <!-- Dimension arrows showing extrusion depth -->
    <line x1="110" y1="-70" x2="110" y2="90" stroke="#e67e22" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="105" y1="-70" x2="115" y2="-70" stroke="#e67e22" stroke-width="2"/>
    <line x1="105" y1="90" x2="115" y2="90" stroke="#e67e22" stroke-width="2"/>

    <!-- Depth label -->
    <rect x="120" y="0" width="70" height="22" fill="white" stroke="#e67e22" stroke-width="2" rx="2"/>
    <text x="130" y="15" font-family="Inter, Arial" font-size="12" fill="#e67e22" font-weight="700">3mm</text>
  </g>

  <!-- Extrude Dialog Panel (Right Side) -->
  <rect x="920" y="100" width="260" height="500" fill="white" stroke="#3498db" stroke-width="2" rx="6"/>

  <!-- Dialog Header -->
  <rect x="920" y="100" width="260" height="40" fill="#3498db" rx="6"/>
  <text x="940" y="127" font-family="Inter, Arial" font-size="15" fill="white" font-weight="700">Extrude</text>

  <!-- Dialog Content -->
  <g transform="translate(940, 160)">
    <!-- Type Selection -->
    <text x="0" y="0" font-family="Inter, Arial" font-size="11" fill="#7f8c8d" font-weight="600">TYPE</text>
    <rect x="0" y="10" width="220" height="35" fill="#e8f4f8" stroke="#3498db" stroke-width="2" rx="4"/>
    <circle cx="10" cy="27" r="6" fill="#3498db" stroke="#3498db" stroke-width="2"/>
    <circle cx="10" cy="27" r="3" fill="white"/>
    <text x="25" y="32" font-family="Inter, Arial" font-size="12" fill="#2c3e50" font-weight="600">Solid</text>
    <text x="140" y="32" font-family="Inter, Arial" font-size="11" fill="#7f8c8d">Surface | Thin</text>

    <!-- Operation Selection -->
    <text x="0" y="65" font-family="Inter, Arial" font-size="11" fill="#7f8c8d" font-weight="600">OPERATION</text>
    <rect x="0" y="75" width="220" height="35" fill="#e8f4f8" stroke="#3498db" stroke-width="2" rx="4"/>
    <circle cx="10" cy="92" r="6" fill="#3498db" stroke="#3498db" stroke-width="2"/>
    <circle cx="10" cy="92" r="3" fill="white"/>
    <text x="25" y="97" font-family="Inter, Arial" font-size="12" fill="#2c3e50" font-weight="600">New</text>
    <text x="100" y="97" font-family="Inter, Arial" font-size="11" fill="#7f8c8d">Add | Remove | Intersect</text>

    <!-- End Type -->
    <text x="0" y="130" font-family="Inter, Arial" font-size="11" fill="#7f8c8d" font-weight="600">END TYPE</text>
    <rect x="0" y="140" width="220" height="30" fill="white" stroke="#95a5a6" stroke-width="1" rx="4"/>
    <text x="10" y="162" font-family="Inter, Arial" font-size="12" fill="#2c3e50" font-weight="600">Blind</text>
    <polygon points="205,155 210,160 205,165" fill="#7f8c8d"/>

    <!-- Depth Input -->
    <text x="0" y="190" font-family="Inter, Arial" font-size="11" fill="#7f8c8d" font-weight="600">DEPTH</text>
    <rect x="0" y="200" width="220" height="35" fill="white" stroke="#3498db" stroke-width="2" rx="4"/>
    <text x="15" y="223" font-family="Inter, Arial" font-size="14" fill="#2c3e50" font-weight="700">3 mm</text>
    <text x="175" y="223" font-family="Inter, Arial" font-size="11" fill="#7f8c8d">▲ ▼</text>

    <!-- Direction -->
    <text x="0" y="255" font-family="Inter, Arial" font-size="11" fill="#7f8c8d" font-weight="600">DIRECTION</text>
    <rect x="0" y="265" width="105" height="28" fill="white" stroke="#95a5a6" stroke-width="1" rx="4"/>
    <text x="10" y="283" font-family="Inter, Arial" font-size="11" fill="#2c3e50">Forward</text>
    <polygon points="90,278 95,283 90,288" fill="#7f8c8d"/>

    <!-- Symmetric Toggle -->
    <rect x="115" y="265" width="105" height="28" fill="#ecf0f1" stroke="#95a5a6" stroke-width="1" rx="4"/>
    <rect x="125" y="272" width="14" height="14" fill="white" stroke="#95a5a6" stroke-width="1" rx="2"/>
    <text x="145" y="283" font-family="Inter, Arial" font-size="11" fill="#7f8c8d">Symmetric</text>

    <!-- Draft Angle -->
    <text x="0" y="315" font-family="Inter, Arial" font-size="11" fill="#7f8c8d" font-weight="600">DRAFT ANGLE</text>
    <rect x="0" y="325" width="220" height="30" fill="#ecf0f1" stroke="#95a5a6" stroke-width="1" rx="4"/>
    <text x="15" y="345" font-family="Inter, Arial" font-size="12" fill="#95a5a6">0°</text>

    <!-- Action Buttons -->
    <rect x="0" y="380" width="100" height="35" fill="#95a5a6" rx="4"/>
    <text x="30" y="403" font-family="Inter, Arial" font-size="13" fill="white" font-weight="600">Cancel</text>

    <rect x="120" y="380" width="100" height="35" fill="#27ae60" rx="4"/>
    <text x="158" y="403" font-family="Inter, Arial" font-size="13" fill="white" font-weight="600">✓ OK</text>
  </g>

  <!-- Preview indicator -->
  <rect x="360" y="70" width="140" height="30" fill="#fff3cd" stroke="#f39c12" stroke-width="1" rx="4"/>
  <text x="375" y="90" font-family="Inter, Arial" font-size="11" fill="#e67e22" font-weight="600">Preview Active</text>

  <!-- Annotations -->
  <g>
    <!-- Arrow pointing to 3mm depth -->
    <circle cx="800" cy="400" r="3" fill="#e67e22"/>
    <text x="805" y="405" font-family="Inter, Arial" font-size="11" fill="#e67e22" font-weight="600">Wall thickness:</text>
    <text x="805" y="420" font-family="Inter, Arial" font-size="11" fill="#7f8c8d">3mm for structural strength</text>

    <!-- Arrow pointing to extrude dialog -->
    <circle cx="915" cy="300" r="3" fill="#e67e22"/>
    <line x1="890" y1="300" x2="910" y2="300" stroke="#e67e22" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="800" y="305" font-family="Inter, Arial" font-size="11" fill="#e67e22" font-weight="600">Set depth here</text>
  </g>

  <!-- Step indicator -->
  <rect x="360" y="680" width="220" height="100" fill="#e8f4f8" rx="6"/>
  <text x="380" y="705" font-family="Inter, Arial" font-size="12" fill="#7f8c8d" font-weight="600">STEP 3 OF 5</text>
  <text x="380" y="725" font-family="Inter, Arial" font-size="14" fill="#2c3e50" font-weight="700">Extrude Dialog</text>
  <text x="380" y="745" font-family="Inter, Arial" font-size="11" fill="#7f8c8d">1. Select Extrude tool</text>
  <text x="380" y="760" font-family="Inter, Arial" font-size="11" fill="#7f8c8d">2. Set depth (3mm)</text>
  <text x="380" y="775" font-family="Inter, Arial" font-size="11" fill="#7f8c8d">3. Click OK to create 3D part</text>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#e67e22"/>
    </marker>
  </defs>

  <!-- View control indicator -->
  <rect x="360" y="120" width="100" height="25" fill="#ecf0f1" rx="4"/>
  <text x="375" y="138" font-family="Inter, Arial" font-size="11" fill="#2c3e50" font-weight="600">View: ISO</text>
</svg>