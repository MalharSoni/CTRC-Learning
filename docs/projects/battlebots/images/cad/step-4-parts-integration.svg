<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#f5f5f5"/>

  <!-- Top Menu Bar -->
  <rect x="0" y="0" width="1200" height="50" fill="#2c3e50"/>
  <text x="20" y="30" font-family="Inter, Arial" font-size="16" fill="white" font-weight="600">Onshape</text>
  <text x="120" y="30" font-family="Inter, Arial" font-size="14" fill="#bdc3c7">CTRC-BattleBot-YourName - Assembly</text>

  <!-- Left Toolbar (Assembly Mode) -->
  <rect x="0" y="50" width="60" height="750" fill="#34495e"/>

  <!-- Assembly Tools -->
  <g>
    <!-- Insert tool -->
    <rect x="15" y="80" width="30" height="30" rx="4" fill="#7f8c8d"/>
    <rect x="22" y="90" width="16" height="10" fill="none" stroke="white" stroke-width="2"/>
    <line x1="30" y1="85" x2="30" y2="95" stroke="white" stroke-width="2"/>
    <line x1="25" y1="90" x2="35" y2="90" stroke="white" stroke-width="2"/>

    <!-- Mate tool (highlighted) -->
    <rect x="15" y="120" width="30" height="30" rx="4" fill="#3498db"/>
    <circle cx="25" cy="135" r="5" fill="none" stroke="white" stroke-width="2"/>
    <circle cx="35" cy="135" r="5" fill="none" stroke="white" stroke-width="2"/>
    <line x1="25" y1="135" x2="35" y2="135" stroke="white" stroke-width="2"/>
    <text x="75" y="140" font-family="Inter, Arial" font-size="12" fill="#2c3e50" font-weight="600">← Mate Connector</text>

    <!-- Fastened tool -->
    <rect x="15" y="160" width="30" height="30" rx="4" fill="#7f8c8d"/>
    <circle cx="30" cy="175" r="7" fill="none" stroke="white" stroke-width="2"/>
    <circle cx="30" cy="175" r="3" fill="white"/>
  </g>

  <!-- Feature Tree Panel -->
  <rect x="60" y="50" width="280" height="750" fill="white" stroke="#bdc3c7" stroke-width="1"/>
  <text x="80" y="80" font-family="Inter, Arial" font-size="14" fill="#2c3e50" font-weight="700">Assembly Tree</text>

  <!-- Assembly Parts List -->
  <g>
    <!-- Assembly name -->
    <rect x="80" y="100" width="240" height="30" fill="#ecf0f1" rx="3"/>
    <text x="90" y="120" font-family="Inter, Arial" font-size="13" fill="#2c3e50" font-weight="600">BattleBot Assembly</text>

    <!-- Chassis part -->
    <g>
      <rect x="90" y="140" width="220" height="25" fill="white" rx="3"/>
      <rect x="95" y="145" width="14" height="14" fill="#3498db" stroke="#2c3e50" stroke-width="1"/>
      <text x="115" y="157" font-family="Inter, Arial" font-size="12" fill="#2c3e50">Chassis &lt;1&gt;</text>
      <circle cx="290" cy="152" r="4" fill="#27ae60"/>
    </g>

    <!-- N20 Motor Left -->
    <g>
      <rect x="90" y="170" width="220" height="25" fill="white" rx="3"/>
      <circle cx="102" cy="182" r="7" fill="#95a5a6" stroke="#2c3e50" stroke-width="1"/>
      <text x="115" y="187" font-family="Inter, Arial" font-size="12" fill="#2c3e50">N20-Motor-Left &lt;1&gt;</text>
      <circle cx="290" cy="182" r="4" fill="#27ae60"/>
    </g>

    <!-- N20 Motor Right -->
    <g>
      <rect x="90" y="200" width="220" height="25" fill="white" rx="3"/>
      <circle cx="102" cy="212" r="7" fill="#95a5a6" stroke="#2c3e50" stroke-width="1"/>
      <text x="115" y="217" font-family="Inter, Arial" font-size="12" fill="#2c3e50">N20-Motor-Right &lt;1&gt;</text>
      <circle cx="290" cy="212" r="4" fill="#27ae60"/>
    </g>

    <!-- Wheel Left -->
    <g>
      <rect x="90" y="230" width="220" height="25" fill="#e8f4f8" rx="3"/>
      <circle cx="102" cy="242" r="7" fill="#2c3e50" stroke="#2c3e50" stroke-width="1"/>
      <text x="115" y="247" font-family="Inter, Arial" font-size="12" fill="#2c3e50" font-weight="600">Wheel-Left &lt;1&gt;</text>
      <text x="245" y="247" font-family="Inter, Arial" font-size="10" fill="#3498db">NEW</text>
    </g>

    <!-- Wheel Right -->
    <g>
      <rect x="90" y="260" width="220" height="25" fill="white" rx="3"/>
      <circle cx="102" cy="272" r="7" fill="#2c3e50" stroke="#2c3e50" stroke-width="1"/>
      <text x="115" y="277" font-family="Inter, Arial" font-size="12" fill="#7f8c8d">Wheel-Right &lt;1&gt;</text>
    </g>

    <!-- Mates section -->
    <rect x="80" y="300" width="240" height="25" fill="#ecf0f1" rx="3"/>
    <text x="90" y="317" font-family="Inter, Arial" font-size="12" fill="#2c3e50" font-weight="700">Mates (4)</text>

    <!-- Individual mates -->
    <g transform="translate(90, 330)">
      <circle cx="10" cy="10" r="3" fill="#27ae60"/>
      <text x="20" y="14" font-family="Inter, Arial" font-size="11" fill="#2c3e50">Fixed (Chassis)</text>

      <circle cx="10" cy="30" r="3" fill="#27ae60"/>
      <text x="20" y="34" font-family="Inter, Arial" font-size="11" fill="#2c3e50">Revolute (Motor-L)</text>

      <circle cx="10" cy="50" r="3" fill="#27ae60"/>
      <text x="20" y="54" font-family="Inter, Arial" font-size="11" fill="#2c3e50">Revolute (Motor-R)</text>

      <circle cx="10" cy="70" r="3" fill="#3498db"/>
      <text x="20" y="74" font-family="Inter, Arial" font-size="11" fill="#3498db" font-weight="600">Revolute (Wheel-L) ←</text>
    </g>
  </g>

  <!-- Main Graphics Area - 3D Assembly View -->
  <rect x="340" y="50" width="860" height="750" fill="#f8f9fa"/>

  <!-- 3D Coordinate system -->
  <g transform="translate(1050, 200)">
    <!-- X axis (red) -->
    <line x1="0" y1="0" x2="60" y2="-15" stroke="#e74c3c" stroke-width="3"/>
    <text x="65" y="-10" font-family="Inter, Arial" font-size="14" fill="#e74c3c" font-weight="700">X</text>

    <!-- Y axis (green) -->
    <line x1="0" y1="0" x2="-45" y2="-22" stroke="#2ecc71" stroke-width="3"/>
    <text x="-60" y="-18" font-family="Inter, Arial" font-size="14" fill="#2ecc71" font-weight="700">Y</text>

    <!-- Z axis (blue) -->
    <line x1="0" y1="0" x2="0" y2="-70" stroke="#3498db" stroke-width="3"/>
    <text x="5" y="-75" font-family="Inter, Arial" font-size="14" fill="#3498db" font-weight="700">Z</text>
  </g>

  <!-- Robot Assembly Isometric View -->
  <g transform="translate(650, 450)">
    <!-- Chassis (simplified box) -->
    <!-- Bottom -->
    <polygon points="-120,-60 120,-85 120,75 -120,100" fill="#3498db" opacity="0.4" stroke="#2c3e50" stroke-width="2"/>
    <!-- Front -->
    <polygon points="-120,-60 120,-85 120,-110 -120,-85" fill="#3498db" opacity="0.8" stroke="#2c3e50" stroke-width="2"/>
    <!-- Right -->
    <polygon points="120,-85 120,-110 120,50 120,75" fill="#3498db" opacity="0.6" stroke="#2c3e50" stroke-width="2"/>

    <!-- Left N20 Motor -->
    <g transform="translate(-100, 20)">
      <rect x="-12" y="-25" width="24" height="15" fill="#95a5a6" stroke="#2c3e50" stroke-width="1.5"/>
      <rect x="12" y="-22" width="8" height="9" fill="#7f8c8d" stroke="#2c3e50" stroke-width="1"/>
      <circle cx="23" cy="-17" r="2" fill="#2c3e50"/>
    </g>

    <!-- Right N20 Motor -->
    <g transform="translate(100, 5)">
      <rect x="-12" y="-25" width="24" height="15" fill="#95a5a6" stroke="#2c3e50" stroke-width="1.5"/>
      <rect x="12" y="-22" width="8" height="9" fill="#7f8c8d" stroke="#2c3e50" stroke-width="1"/>
      <circle cx="23" cy="-17" r="2" fill="#2c3e50"/>
    </g>

    <!-- Left Wheel (highlighted as being placed) -->
    <g transform="translate(-140, 25)">
      <!-- Wheel body -->
      <ellipse cx="0" cy="0" rx="22" ry="35" fill="#2c3e50" opacity="0.9" stroke="#e67e22" stroke-width="3"/>
      <!-- Tread pattern -->
      <line x1="-18" y1="-25" x2="-18" y2="25" stroke="#95a5a6" stroke-width="2"/>
      <line x1="-10" y1="-30" x2="-10" y2="30" stroke="#95a5a6" stroke-width="2"/>
      <line x1="0" y1="-33" x2="0" y2="33" stroke="#95a5a6" stroke-width="2"/>
      <line x1="10" y1="-30" x2="10" y2="30" stroke="#95a5a6" stroke-width="2"/>
      <!-- Hub center -->
      <circle cx="0" cy="0" r="4" fill="#7f8c8d"/>

      <!-- Mate connector visualization -->
      <g transform="translate(0, 0)">
        <circle cx="0" cy="0" r="8" fill="none" stroke="#3498db" stroke-width="2" stroke-dasharray="3,2"/>
        <line x1="-12" y1="0" x2="12" y2="0" stroke="#3498db" stroke-width="2"/>
        <line x1="0" y1="-12" x2="0" y2="12" stroke="#3498db" stroke-width="2"/>
      </g>
    </g>

    <!-- Right Wheel (grayed out - not yet placed) -->
    <g transform="translate(140, 10)" opacity="0.3">
      <ellipse cx="0" cy="0" rx="22" ry="35" fill="#2c3e50" stroke="#95a5a6" stroke-width="2"/>
      <circle cx="0" cy="0" r="4" fill="#7f8c8d"/>
    </g>

    <!-- Assembly alignment guides (dotted lines) -->
    <line x1="-140" y1="25" x2="-110" y2="12" stroke="#e67e22" stroke-width="2" stroke-dasharray="5,3"/>
  </g>

  <!-- Mate Connector Dialog -->
  <rect x="680" y="120" width="280" height="200" fill="white" stroke="#3498db" stroke-width="2" rx="6"/>
  <rect x="680" y="120" width="280" height="35" fill="#3498db" rx="6"/>
  <text x="700" y="143" font-family="Inter, Arial" font-size="14" fill="white" font-weight="700">Revolute Mate</text>

  <g transform="translate(700, 175)">
    <text x="0" y="0" font-family="Inter, Arial" font-size="11" fill="#7f8c8d" font-weight="600">MATE CONNECTOR 1</text>
    <rect x="0" y="8" width="240" height="28" fill="#e8f4f8" stroke="#3498db" stroke-width="1" rx="4"/>
    <text x="10" y="27" font-family="Inter, Arial" font-size="12" fill="#2c3e50">Motor Shaft (Left)</text>

    <text x="0" y="55" font-family="Inter, Arial" font-size="11" fill="#7f8c8d" font-weight="600">MATE CONNECTOR 2</text>
    <rect x="0" y="63" width="240" height="28" fill="#e8f4f8" stroke="#3498db" stroke-width="1" rx="4"/>
    <text x="10" y="82" font-family="Inter, Arial" font-size="12" fill="#2c3e50">Wheel Hub Center</text>

    <rect x="0" y="110" width="110" height="30" fill="#95a5a6" rx="4"/>
    <text x="25" y="130" font-family="Inter, Arial" font-size="12" fill="white" font-weight="600">Cancel</text>

    <rect x="130" y="110" width="110" height="30" fill="#27ae60" rx="4"/>
    <text x="165" y="130" font-family="Inter, Arial" font-size="12" fill="white" font-weight="600">✓ OK</text>
  </g>

  <!-- Annotations -->
  <g>
    <!-- Arrow pointing to wheel -->
    <path d="M 480 450 L 500 470" stroke="#e67e22" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="380" y="450" font-family="Inter, Arial" font-size="11" fill="#e67e22" font-weight="600">Wheel being mated</text>
    <text x="380" y="465" font-family="Inter, Arial" font-size="10" fill="#7f8c8d">to motor shaft</text>

    <!-- Arrow pointing to mate connector -->
    <circle cx="675" cy="220" r="3" fill="#e67e22"/>
    <text x="580" y="225" font-family="Inter, Arial" font-size="11" fill="#e67e22" font-weight="600">Select mate connectors</text>
    <text x="580" y="240" font-family="Inter, Arial" font-size="10" fill="#7f8c8d">to align parts</text>
  </g>

  <!-- Parts Library Panel (Bottom Right) -->
  <rect x="680" y="600" width="280" height="150" fill="white" stroke="#bdc3c7" stroke-width="1" rx="4"/>
  <text x="700" y="625" font-family="Inter, Arial" font-size="12" fill="#2c3e50" font-weight="700">Insert Parts</text>

  <g transform="translate(700, 640)">
    <text x="0" y="0" font-family="Inter, Arial" font-size="10" fill="#7f8c8d">STANDARD PARTS LIBRARY</text>
    <rect x="0" y="8" width="240" height="25" fill="#ecf0f1" rx="3"/>
    <text x="10" y="25" font-family="Inter, Arial" font-size="11" fill="#2c3e50">VEX N20 Motors</text>

    <rect x="0" y="38" width="240" height="25" fill="#ecf0f1" rx="3"/>
    <text x="10" y="55" font-family="Inter, Arial" font-size="11" fill="#2c3e50">Wheels (3D Printed)</text>

    <rect x="0" y="68" width="240" height="25" fill="#ecf0f1" rx="3"/>
    <text x="10" y="85" font-family="Inter, Arial" font-size="11" fill="#2c3e50">Malenki Nano PCB</text>
  </g>

  <!-- Step indicator -->
  <rect x="360" y="650" width="250" height="110" fill="#e8f4f8" rx="6"/>
  <text x="380" y="675" font-family="Inter, Arial" font-size="12" fill="#7f8c8d" font-weight="600">STEP 4 OF 5</text>
  <text x="380" y="695" font-family="Inter, Arial" font-size="14" fill="#2c3e50" font-weight="700">VEX Parts Integration</text>
  <text x="380" y="715" font-family="Inter, Arial" font-size="11" fill="#7f8c8d">1. Insert parts (motors, wheels)</text>
  <text x="380" y="730" font-family="Inter, Arial" font-size="11" fill="#7f8c8d">2. Use Mate tool to align parts</text>
  <text x="380" y="745" font-family="Inter, Arial" font-size="11" fill="#7f8c8d">3. Select Revolute for rotating</text>
  <text x="385" y="760" font-family="Inter, Arial" font-size="11" fill="#7f8c8d">parts (wheels on motor shafts)</text>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#e67e22"/>
    </marker>
  </defs>

  <!-- View control indicator -->
  <rect x="360" y="70" width="100" height="25" fill="#ecf0f1" rx="4"/>
  <text x="375" y="88" font-family="Inter, Arial" font-size="11" fill="#2c3e50" font-weight="600">View: ISO</text>
</svg>