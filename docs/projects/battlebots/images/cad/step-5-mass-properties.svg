<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#f5f5f5"/>

  <!-- Top Menu Bar -->
  <rect x="0" y="0" width="1200" height="50" fill="#2c3e50"/>
  <text x="20" y="30" font-family="Inter, Arial" font-size="16" fill="white" font-weight="600">Onshape</text>
  <text x="120" y="30" font-family="Inter, Arial" font-size="14" fill="#bdc3c7">CTRC-BattleBot-YourName - Assembly</text>

  <!-- Tools Menu Bar -->
  <rect x="0" y="50" width="1200" height="40" fill="#34495e"/>
  <text x="20" y="73" font-family="Inter, Arial" font-size="13" fill="white">File</text>
  <text x="80" y="73" font-family="Inter, Arial" font-size="13" fill="white">Edit</text>
  <text x="140" y="73" font-family="Inter, Arial" font-size="13" fill="white">View</text>
  <text x="200" y="73" font-family="Inter, Arial" font-size="13" fill="white">Insert</text>
  <text x="270" y="73" font-family="Inter, Arial" font-size="13" fill="white">Tools</text>
  <rect x="260" y="55" width="60" height="30" fill="#3498db" rx="3"/>
  <text x="270" y="73" font-family="Inter, Arial" font-size="13" fill="white" font-weight="600">Tools</text>
  <text x="350" y="73" font-family="Inter, Arial" font-size="13" fill="white">Assemblies</text>

  <!-- Left Toolbar -->
  <rect x="0" y="90" width="60" height="710" fill="#34495e"/>

  <!-- Feature Tree Panel -->
  <rect x="60" y="90" width="280" height="710" fill="white" stroke="#bdc3c7" stroke-width="1"/>
  <text x="80" y="120" font-family="Inter, Arial" font-size="14" fill="#2c3e50" font-weight="700">Assembly Tree</text>

  <!-- Assembly Parts List (Complete) -->
  <g>
    <!-- Assembly name -->
    <rect x="80" y="140" width="240" height="30" fill="#ecf0f1" rx="3"/>
    <text x="90" y="160" font-family="Inter, Arial" font-size="13" fill="#2c3e50" font-weight="600">BattleBot Assembly</text>
    <text x="245" y="160" font-family="Inter, Arial" font-size="10" fill="#27ae60">✓</text>

    <!-- Parts list -->
    <g transform="translate(90, 180)">
      <rect x="0" y="0" width="220" height="22" fill="white" rx="2"/>
      <rect x="5" y="5" width="12" height="12" fill="#3498db" stroke="#2c3e50" stroke-width="1"/>
      <text x="22" y="15" font-family="Inter, Arial" font-size="11" fill="#2c3e50">Chassis &lt;1&gt;</text>

      <rect x="0" y="25" width="220" height="22" fill="white" rx="2"/>
      <circle cx="11" cy="36" r="6" fill="#95a5a6" stroke="#2c3e50" stroke-width="1"/>
      <text x="22" y="40" font-family="Inter, Arial" font-size="11" fill="#2c3e50">N20-Motor-L &lt;1&gt;</text>

      <rect x="0" y="50" width="220" height="22" fill="white" rx="2"/>
      <circle cx="11" cy="61" r="6" fill="#95a5a6" stroke="#2c3e50" stroke-width="1"/>
      <text x="22" y="65" font-family="Inter, Arial" font-size="11" fill="#2c3e50">N20-Motor-R &lt;1&gt;</text>

      <rect x="0" y="75" width="220" height="22" fill="white" rx="2"/>
      <circle cx="11" cy="86" r="6" fill="#2c3e50" stroke="#2c3e50" stroke-width="1"/>
      <text x="22" y="90" font-family="Inter, Arial" font-size="11" fill="#2c3e50">Wheel-Left &lt;1&gt;</text>

      <rect x="0" y="100" width="220" height="22" fill="white" rx="2"/>
      <circle cx="11" cy="111" r="6" fill="#2c3e50" stroke="#2c3e50" stroke-width="1"/>
      <text x="22" y="115" font-family="Inter, Arial" font-size="11" fill="#2c3e50">Wheel-Right &lt;1&gt;</text>

      <rect x="0" y="125" width="220" height="22" fill="white" rx="2"/>
      <circle cx="11" cy="136" r="6" fill="#e67e22" stroke="#2c3e50" stroke-width="1"/>
      <text x="22" y="140" font-family="Inter, Arial" font-size="11" fill="#2c3e50">Weapon-Drum &lt;1&gt;</text>

      <rect x="0" y="150" width="220" height="22" fill="white" rx="2"/>
      <rect x="5" y="155" width="12" height="12" fill="#9b59b6" stroke="#2c3e50" stroke-width="1"/>
      <text x="22" y="165" font-family="Inter, Arial" font-size="11" fill="#2c3e50">Malenki-Nano &lt;1&gt;</text>

      <rect x="0" y="175" width="220" height="22" fill="white" rx="2"/>
      <rect x="5" y="180" width="12" height="12" fill="#e74c3c" stroke="#2c3e50" stroke-width="1"/>
      <text x="22" y="190" font-family="Inter, Arial" font-size="11" fill="#2c3e50">Battery-2S &lt;1&gt;</text>
    </g>
  </g>

  <!-- Main Graphics Area - 3D Assembly View -->
  <rect x="340" y="90" width="860" height="710" fill="#f8f9fa"/>

  <!-- Complete Robot Assembly -->
  <g transform="translate(650, 450)">
    <!-- Chassis -->
    <polygon points="-120,-60 120,-85 120,75 -120,100" fill="#3498db" opacity="0.4" stroke="#2c3e50" stroke-width="2"/>
    <polygon points="-120,-60 120,-85 120,-110 -120,-85" fill="#3498db" opacity="0.8" stroke="#2c3e50" stroke-width="2"/>
    <polygon points="120,-85 120,-110 120,50 120,75" fill="#3498db" opacity="0.6" stroke="#2c3e50" stroke-width="2"/>

    <!-- Motors -->
    <g transform="translate(-100, 20)">
      <rect x="-12" y="-25" width="24" height="15" fill="#95a5a6" stroke="#2c3e50" stroke-width="1.5"/>
    </g>
    <g transform="translate(100, 5)">
      <rect x="-12" y="-25" width="24" height="15" fill="#95a5a6" stroke="#2c3e50" stroke-width="1.5"/>
    </g>

    <!-- Wheels -->
    <g transform="translate(-140, 25)">
      <ellipse cx="0" cy="0" rx="22" ry="35" fill="#2c3e50" opacity="0.8" stroke="#2c3e50" stroke-width="2"/>
    </g>
    <g transform="translate(140, 10)">
      <ellipse cx="0" cy="0" rx="22" ry="35" fill="#2c3e50" opacity="0.8" stroke="#2c3e50" stroke-width="2"/>
    </g>

    <!-- Weapon drum (front) -->
    <g transform="translate(0, -40)">
      <ellipse cx="0" cy="0" rx="18" ry="30" fill="#e67e22" opacity="0.7" stroke="#2c3e50" stroke-width="2"/>
      <rect x="-3" y="-30" width="6" height="10" fill="#c0392b"/>
      <rect x="-3" y="20" width="6" height="10" fill="#c0392b"/>
    </g>

    <!-- Center of Mass indicator (crosshairs) -->
    <g transform="translate(5, 0)">
      <circle cx="0" cy="0" r="25" fill="none" stroke="#27ae60" stroke-width="3" stroke-dasharray="8,4"/>
      <line x1="-35" y1="0" x2="35" y2="0" stroke="#27ae60" stroke-width="3"/>
      <line x1="0" y1="-35" x2="0" y2="35" stroke="#27ae60" stroke-width="3"/>
      <circle cx="0" cy="0" r="8" fill="#27ae60" opacity="0.7"/>
      <text x="10" y="-30" font-family="Inter, Arial" font-size="12" fill="#27ae60" font-weight="700">CoM</text>
    </g>
  </g>

  <!-- Mass Properties Dialog (Large, Right Side) -->
  <rect x="680" y="120" width="480" height="630" fill="white" stroke="#3498db" stroke-width="3" rx="8"/>

  <!-- Dialog Header -->
  <rect x="680" y="120" width="480" height="45" fill="#3498db" rx="8"/>
  <text x="710" y="150" font-family="Inter, Arial" font-size="16" fill="white" font-weight="700">Mass Properties</text>
  <circle cx="1145" cy="142" r="12" fill="#e74c3c"/>
  <line x1="1140" y1="137" x2="1150" y2="147" stroke="white" stroke-width="2"/>
  <line x1="1150" y1="137" x2="1140" y2="147" stroke="white" stroke-width="2"/>

  <!-- Dialog Content -->
  <g transform="translate(710, 190)">
    <!-- Selection -->
    <text x="0" y="0" font-family="Inter, Arial" font-size="12" fill="#7f8c8d" font-weight="600">SELECTION</text>
    <rect x="0" y="8" width="420" height="32" fill="#e8f4f8" stroke="#3498db" stroke-width="1" rx="4"/>
    <text x="15" y="30" font-family="Inter, Arial" font-size="13" fill="#2c3e50" font-weight="600">BattleBot Assembly (all parts)</text>

    <!-- Material -->
    <text x="0" y="65" font-family="Inter, Arial" font-size="12" fill="#7f8c8d" font-weight="600">MATERIAL</text>
    <rect x="0" y="73" width="420" height="32" fill="white" stroke="#95a5a6" stroke-width="1" rx="4"/>
    <text x="15" y="95" font-family="Inter, Arial" font-size="13" fill="#2c3e50">PLA+ (ρ = 1.24 g/cm³)</text>

    <!-- Divider -->
    <line x1="0" y1="125" x2="420" y2="125" stroke="#bdc3c7" stroke-width="1"/>

    <!-- Mass -->
    <text x="0" y="155" font-family="Inter, Arial" font-size="12" fill="#7f8c8d" font-weight="700">TOTAL MASS</text>
    <rect x="0" y="165" width="420" height="50" fill="#e8f8f5" stroke="#27ae60" stroke-width="2" rx="6"/>
    <text x="20" y="200" font-family="Inter, Arial" font-size="28" fill="#27ae60" font-weight="900">487.3 g</text>
    <text x="320" y="195" font-family="Inter, Arial" font-size="11" fill="#27ae60" font-weight="600">✓ Under 500g limit</text>

    <!-- Volume -->
    <text x="0" y="240" font-family="Inter, Arial" font-size="11" fill="#7f8c8d" font-weight="600">VOLUME</text>
    <text x="350" y="240" font-family="Inter, Arial" font-size="12" fill="#2c3e50" font-weight="600">393.0 cm³</text>

    <!-- Surface Area -->
    <text x="0" y="265" font-family="Inter, Arial" font-size="11" fill="#7f8c8d" font-weight="600">SURFACE AREA</text>
    <text x="350" y="265" font-family="Inter, Arial" font-size="12" fill="#2c3e50" font-weight="600">542.8 cm²</text>

    <!-- Divider -->
    <line x1="0" y1="285" x2="420" y2="285" stroke="#bdc3c7" stroke-width="1"/>

    <!-- Center of Mass -->
    <text x="0" y="310" font-family="Inter, Arial" font-size="12" fill="#7f8c8d" font-weight="700">CENTER OF MASS (mm)</text>

    <g transform="translate(0, 320)">
      <rect x="0" y="0" width="130" height="35" fill="white" stroke="#95a5a6" stroke-width="1" rx="4"/>
      <text x="10" y="15" font-family="Inter, Arial" font-size="10" fill="#e74c3c" font-weight="600">X</text>
      <text x="10" y="28" font-family="Inter, Arial" font-size="13" fill="#2c3e50" font-weight="600">5.2</text>

      <rect x="145" y="0" width="130" height="35" fill="white" stroke="#95a5a6" stroke-width="1" rx="4"/>
      <text x="155" y="15" font-family="Inter, Arial" font-size="10" fill="#2ecc71" font-weight="600">Y</text>
      <text x="155" y="28" font-family="Inter, Arial" font-size="13" fill="#2c3e50" font-weight="600">-12.8</text>

      <rect x="290" y="0" width="130" height="35" fill="white" stroke="#95a5a6" stroke-width="1" rx="4"/>
      <text x="300" y="15" font-family="Inter, Arial" font-size="10" fill="#3498db" font-weight="600">Z</text>
      <text x="300" y="28" font-family="Inter, Arial" font-size="13" fill="#2c3e50" font-weight="600">18.3</text>
    </g>

    <!-- CoM Interpretation -->
    <rect x="0" y="365" width="420" height="80" fill="#fffbea" stroke="#f39c12" stroke-width="1" rx="4"/>
    <text x="15" y="385" font-family="Inter, Arial" font-size="11" fill="#2c3e50" font-weight="700">Center of Mass Analysis:</text>
    <text x="15" y="402" font-family="Inter, Arial" font-size="10" fill="#7f8c8d">✓ X: 5.2mm right of center (acceptable)</text>
    <text x="15" y="417" font-family="Inter, Arial" font-size="10" fill="#7f8c8d">✓ Y: -12.8mm toward rear (good traction)</text>
    <text x="15" y="432" font-family="Inter, Arial" font-size="10" fill="#7f8c8d">✓ Z: 18.3mm above ground (low, stable)</text>

    <!-- Moments of Inertia -->
    <text x="0" y="470" font-family="Inter, Arial" font-size="11" fill="#7f8c8d" font-weight="600">MOMENTS OF INERTIA (g·mm²)</text>

    <g transform="translate(0, 478)">
      <text x="0" y="15" font-family="Inter, Arial" font-size="10" fill="#7f8c8d">Ixx:</text>
      <text x="100" y="15" font-family="Inter, Arial" font-size="11" fill="#2c3e50">24,531</text>

      <text x="0" y="32" font-family="Inter, Arial" font-size="10" fill="#7f8c8d">Iyy:</text>
      <text x="100" y="32" font-family="Inter, Arial" font-size="11" fill="#2c3e50">28,422</text>

      <text x="0" y="49" font-family="Inter, Arial" font-size="10" fill="#7f8c8d">Izz:</text>
      <text x="100" y="49" font-family="Inter, Arial" font-size="11" fill="#2c3e50">19,873</text>
    </g>

    <!-- Action Buttons -->
    <g transform="translate(0, 550)">
      <rect x="0" y="0" width="130" height="35" fill="#95a5a6" rx="4"/>
      <text x="35" y="23" font-family="Inter, Arial" font-size="13" fill="white" font-weight="600">Export</text>

      <rect x="145" y="0" width="130" height="35" fill="#3498db" rx="4"/>
      <text x="165" y="23" font-family="Inter, Arial" font-size="13" fill="white" font-weight="600">Show CoM</text>

      <rect x="290" y="0" width="130" height="35" fill="#27ae60" rx="4"/>
      <text x="328" y="23" font-family="Inter, Arial" font-size="13" fill="white" font-weight="600">✓ Close</text>
    </g>
  </g>

  <!-- Annotations -->
  <g>
    <!-- Arrow pointing to CoM on robot -->
    <path d="M 600 420 L 650 440" stroke="#27ae60" stroke-width="3" marker-end="url(#arrowhead-green)"/>
    <text x="540" y="415" font-family="Inter, Arial" font-size="12" fill="#27ae60" font-weight="700">Center of Mass</text>
    <text x="540" y="430" font-family="Inter, Arial" font-size="10" fill="#7f8c8d">Low and centered</text>
    <text x="540" y="443" font-family="Inter, Arial" font-size="10" fill="#7f8c8d">for stability</text>

    <!-- Arrow pointing to mass value -->
    <circle cx="675" cy="310" r="3" fill="#e67e22"/>
    <path d="M 645 310 L 670 310" stroke="#e67e22" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="550" y="315" font-family="Inter, Arial" font-size="11" fill="#e67e22" font-weight="600">Check weight</text>
    <text x="550" y="330" font-family="Inter, Arial" font-size="10" fill="#7f8c8d">Must be under 500g</text>
  </g>

  <!-- Step indicator -->
  <rect x="360" y="650" width="250" height="130" fill="#e8f8f5" rx="6"/>
  <text x="380" y="675" font-family="Inter, Arial" font-size="12" fill="#7f8c8d" font-weight="600">STEP 5 OF 5</text>
  <text x="380" y="695" font-family="Inter, Arial" font-size="14" fill="#2c3e50" font-weight="700">Mass Properties Check</text>
  <text x="380" y="715" font-family="Inter, Arial" font-size="11" fill="#7f8c8d">1. Select all parts in assembly</text>
  <text x="380" y="730" font-family="Inter, Arial" font-size="11" fill="#7f8c8d">2. Tools → Mass Properties</text>
  <text x="380" y="745" font-family="Inter, Arial" font-size="11" fill="#7f8c8d">3. Verify: Total mass &lt; 500g</text>
  <text x="380" y="760" font-family="Inter, Arial" font-size="11" fill="#7f8c8d">4. Verify: CoM is low & centered</text>
  <text x="380" y="775" font-family="Inter, Arial" font-size="11" fill="#7f8c8d">5. Adjust design if needed</text>

  <!-- Arrow marker definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#e67e22"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- 3D Coordinate system -->
  <g transform="translate(1050, 200)">
    <line x1="0" y1="0" x2="60" y2="-15" stroke="#e74c3c" stroke-width="3"/>
    <text x="65" y="-10" font-family="Inter, Arial" font-size="14" fill="#e74c3c" font-weight="700">X</text>
    <line x1="0" y1="0" x2="-45" y2="-22" stroke="#2ecc71" stroke-width="3"/>
    <text x="-60" y="-18" font-family="Inter, Arial" font-size="14" fill="#2ecc71" font-weight="700">Y</text>
    <line x1="0" y1="0" x2="0" y2="-70" stroke="#3498db" stroke-width="3"/>
    <text x="5" y="-75" font-family="Inter, Arial" font-size="14" fill="#3498db" font-weight="700">Z</text>
  </g>

  <!-- View control -->
  <rect x="360" y="110" width="100" height="25" fill="#ecf0f1" rx="4"/>
  <text x="375" y="128" font-family="Inter, Arial" font-size="11" fill="#2c3e50" font-weight="600">View: ISO</text>
</svg>